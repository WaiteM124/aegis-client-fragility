inputs:
# Cited WOR: 2016 average net borrowing £586.5m vs year-end £218.9m →
# intra-year absorption £367.6m / available liquidity
# (cash £469.8m + undrawn bank £724.1m = £1,193.9m) ≈ 0.31
# (fy-results-2016 key figures, cash-flow table, note 9).
- id: liquidity_shock
  worst_on_record: 0.31
  lower_bound: 0.0
  upper_bound: 1.0
  source:
    label: fy-results-2016 — average vs year-end net borrowing / available liquidity
    as_of: "2017-03-01"
    note: >
      WOR = (586.5 − 218.9) / (469.8 + (870.0 − 145.9)) ≈ 0.31.
      Structural cash-absorption swing observed in 2016 accounts; not a forecast.
# Cited WOR: Middle East order book + probable orders £0.8bn (2015) → £0.5bn
# (2016) = 37.5% contraction (fy-results-2016 ME construction section).
- id: me_order_book_shock
  worst_on_record: 0.375
  lower_bound: 0.0
  upper_bound: 1.0
  source:
    label: fy-results-2016 — ME orders+probable £0.8bn to £0.5bn
    as_of: "2017-03-01"
    note: >
      Observed year-on-year contraction of ME construction order book plus
      probable orders. Structural scan anchor only.
# No pack figure for a general supplier-interruption intensity → unknown.
- id: supply_shock
  worst_on_record: null
  lower_bound: 0.0
  upper_bound: 1.0
  source:
    label: unknown — no cited general supply-interruption WOR in pack
    as_of: "2017-03-01"
    note: Marked unknown; method treats missing WOR as not tested / fragile.
# No pack figure for a historical construction cost-overrun fraction → unknown.
- id: construction_cost_shock
  worst_on_record: null
  lower_bound: 0.0
  upper_bound: 1.0
  source:
    label: unknown — no cited construction input-cost overrun WOR in pack
    as_of: "2017-03-01"
    note: Marked unknown; see GAPS.md.
ruin_line:
  # Method-default survival floor (metrics/thresholds.py at carillion-method-v1).
  # Not a Carillion-disclosed figure.
  survival_floor: 0.5
# --- Optional financial sections (ADR-019) ---
liquidity:
  cash_on_hand: 469.8
  currency: GBPm
  # Not disclosed as a single fixed-monthly figure → null (fragile for runway).
  fixed_monthly_outflows: null
  stress_input_id: liquidity_shock
  committed_facilities:
  - id: committed_bank_facilities
    limit: 870.0
    drawn: 145.9
    source:
      label: fy-results-2016 — committed bank facilities £870m; bank loans £145.9m
      as_of: "2016-12-31"
      note: >
        Key figures table (facilities) and note 9 (bank loans). Undrawn =
        870.0 − 145.9 = 724.1. Main RCF £790m renewed Nov 2015
        (bank-facility-renewal-2015) plus bilaterals to £870m (ar-2015).
  - id: schuldschein_jan_2017
    limit: 112.0
    drawn: 112.0
    source:
      label: schuldschein-refinancing-2017 / fy-results-2016 — £112m Schuldschein
      as_of: "2017-01-30"
      note: >
        Replacement financing for maturing facilities; average maturity ~5 years.
        Fully drawn term funding — adds no undrawn headroom.
  source:
    label: fy-results-2016 — cash £469.8m; facilities; average net borrowing
    as_of: "2016-12-31"
    note: >
      Cash and cash equivalents £469.8m (balance sheet / note 9). Fixed monthly
      outflows not disclosed as one figure — left null (fragile). USPP £360.8m
      and convertibles £170.0m are drawn term debt, not undrawn facilities
      (recorded in GAPS.md / CITATIONS.md).
