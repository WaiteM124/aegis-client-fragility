[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-global-intelligence"
version = "0.1.0"
description = "Global Event Intelligence and Client Impact Assessment Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

[tool.hatch.build.targets.wheel]
packages = ["backend", "metrics"]

[project.optional-dependencies]
metrics = [
    "networkx>=3.3",
    "PyYAML>=6.0.1",
    "pydantic>=2.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "metrics/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
markers = [
    "evaluation: assessment quality evaluation tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E501: line length handled by formatter preference / readability.
# UP038: isinstance(X, (A, B)) → X | Y; deferred to avoid mass edits on existing code.
ignore = ["E501", "UP038"]
