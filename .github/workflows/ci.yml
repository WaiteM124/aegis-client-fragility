# Lint and test the Aegis backend and frontend.
#
# Assumptions:
# - Python 3.12, matching pyproject.toml / inventory.
# - ruff is configured in pyproject.toml and pinned in requirements.txt
#   (same pin installed below for an explicit lint toolchain).
# - Default CI excludes tests marked "evaluation", matching the project README.
#   Unmarked tests under tests/evaluation/ will still run; they use the
#   deterministic provider and local fixtures, no API key.
# - Pub/Sub and Firestore integration tests skip unless emulator env vars are set.
# - PYTHONPATH=. is required, as in the Makefile.
# - Frontend job assumes Node 22 and that `npm run lint` (oxlint) and
#   `npm run build` succeed with the lockfile in frontend/.
# - This workflow does not deploy and does not use repository secrets.
# - No ruff format --check yet (avoids mass-reformat); follow-up if desired.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check backend/ tests/ metrics/

      - name: Run tests
        run: PYTHONPATH=. pytest tests/ metrics/tests/ -m "not evaluation" -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
