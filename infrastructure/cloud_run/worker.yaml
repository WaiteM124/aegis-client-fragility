apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aegis-worker
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: aegis-sa@exalted-cell-475019-b7.iam.gserviceaccount.com
      containerConcurrency: 1
      timeoutSeconds: 300
      containers:
        - image: europe-west2-docker.pkg.dev/exalted-cell-475019-b7/aegis-repo/aegis-worker:latest
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: APP_ENV
              value: "production"
            - name: LOG_FORMAT
              value: "json"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PERSISTENCE_BACKEND
              value: "firestore"
            - name: MESSAGE_BUS_TYPE
              value: "pubsub"
            - name: GEMINI_API_KEY
              value: "not-set"
            - name: MODEL_PROVIDER
              value: "deterministic"
            - name: PUBSUB_PROJECT_ID
              value: "exalted-cell-475019-b7"
  traffic:
    - percent: 100
      latestRevision: true
