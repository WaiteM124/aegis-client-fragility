apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aegis-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: aegis-sa@exalted-cell-475019-b7.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: europe-west2-docker.pkg.dev/exalted-cell-475019-b7/aegis-repo/aegis-backend:latest
          ports:
            - name: http1
              containerPort: 8000
          resources:
            limits:
              cpu: "2"
              memory: "1Gi"
          env:
            - name: APP_ENV
              value: "production"
            - name: LOG_FORMAT
              value: "json"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PERSISTENCE_BACKEND
              value: "firestore"
            - name: GCP_PROJECT_ID
              value: "exalted-cell-475019-b7"
            - name: GOOGLE_CLOUD_PROJECT
              value: "exalted-cell-475019-b7"
            - name: GEMINI_API_KEY
              value: "not-set"
            - name: MODEL_PROVIDER
              value: "deterministic"
            - name: PUBSUB_PROJECT_ID
              value: "exalted-cell-475019-b7"
            - name: MESSAGE_BUS_TYPE
              value: "pubsub"
            # No public dashboard origin is recorded in this repository.
            # Set CORS_ALLOWED_ORIGINS to that origin before applying this
            # manifest, otherwise browsers will be limited to localhost Vite
            # origins and a deployed dashboard will be blocked.
            # - name: CORS_ALLOWED_ORIGINS
            #   value: "https://YOUR-DASHBOARD-ORIGIN"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
  traffic:
    - percent: 100
      latestRevision: true
