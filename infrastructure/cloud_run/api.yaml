# Aegis API — Cloud Run service definition
#
# Deploy:
#   gcloud run services replace infrastructure/cloud_run/api.yaml \
#     --region=us-central1
#
# Replace ${PROJECT_ID} and ${IMAGE_TAG} before deploying, e.g.:
#   envsubst < infrastructure/cloud_run/api.yaml | gcloud run services replace -

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aegis-api
  annotations:
    # External ingress: accepts traffic from the internet
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Keep at least 1 instance warm to avoid cold-start latency for API calls
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: aegis-sa@${PROJECT_ID}.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: gcr.io/${PROJECT_ID}/aegis-backend:${IMAGE_TAG}
          ports:
            - name: http1
              containerPort: 8000
          resources:
            limits:
              cpu: "2"
              memory: "1Gi"
          env:
            - name: APP_ENV
              value: "production"
            - name: LOG_FORMAT
              value: "json"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PERSISTENCE_BACKEND
              value: "firestore_emulator"
            # Sensitive config from Secret Manager (aegis-config secret)
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aegis-config
                  key: GEMINI_API_KEY
            - name: MODEL_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: aegis-config
                  key: MODEL_PROVIDER
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
  traffic:
    - percent: 100
      latestRevision: true
