# Client tolerates down to 30% of baseline — 50% stress leaves 50% → no ruin.
name: low_survival_floor
survival_floor: 0.3
nodes:
- id: s1
  kind: supplier
  type: commodity
  region: local
  technology: bulk
  critical: true
- id: client
  kind: buyer
  critical: false
edges:
- source: s1
  target: client
  share: 1.0
  flow: 100
  capacity: 100
  buffer: 0
  stress_response: linear
inputs:
- id: supply_shock
  worst_on_record: 0.2
  lower_bound: 0.0
  upper_bound: 1.0
ruin_line:
  survival_floor: 0.3
