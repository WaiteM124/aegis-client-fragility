name: two_parallel_routes
nodes:
  - id: s1
    kind: supplier
    type: fuel
    region: gulf
    technology: refine
  - id: route_north
    kind: route
    type: pipeline
    region: north
    technology: pipe
  - id: route_south
    kind: route
    type: tanker
    region: south
    technology: ship
  - id: client
    kind: buyer
edges:
  - source: s1
    target: route_north
    share: 0.5
    flow: 50
    capacity: 70
    buffer: 10
  - source: route_north
    target: client
    share: 0.5
    flow: 50
    capacity: 70
    buffer: 10
  - source: s1
    target: route_south
    share: 0.5
    flow: 50
    capacity: 70
    buffer: 10
  - source: route_south
    target: client
    share: 0.5
    flow: 50
    capacity: 70
    buffer: 10
