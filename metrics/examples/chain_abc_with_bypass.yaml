    kind: supplier
    type: ore
    region: africa
    technology: open-pit
  - id: B
    kind: asset
    type: refinery
    region: africa
    technology: smelt
  - id: D
    kind: route
    type: corridor
    region: africa
    technology: rail
  - id: C
    kind: buyer
edges:
