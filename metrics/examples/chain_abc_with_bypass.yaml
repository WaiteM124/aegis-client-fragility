    target: C
    share: 0.5
    flow: 50
    capacity: 60
    buffer: 0
  - source: A
    target: D
    share: 0.5
    flow: 50
    capacity: 60
    buffer: 0
  - source: D
    target: C
    share: 0.5
    flow: 50
    capacity: 60
    buffer: 0
