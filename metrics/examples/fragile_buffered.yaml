# Buffer absorbs small shocks; larger shocks accelerate loss → fragile / concave.
name: fragile_buffered
nodes:
- id: s1
  kind: supplier
  type: commodity
  region: local
  technology: bulk
  critical: true
- id: client
  kind: buyer
  critical: false
edges:
- source: s1
  target: client
  share: 1.0
  flow: 100
  capacity: 100
  buffer: 15
  stress_response: buffered
inputs:
- id: supply_shock
  worst_on_record: 0.2
  lower_bound: 0.0
  upper_bound: 1.0
ruin_line:
  survival_floor: 0.5
